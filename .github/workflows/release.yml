name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm >=11.5.1; same pin as BullLite.
      - run: npm install --global npm@^11.21.0
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run attw
      # Trusted publisher on npmjs.com: KamelotWalker/depo.db + release.yml; no NPM_TOKEN.
      - run: npm publish --provenance
